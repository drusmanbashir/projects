[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projects"
version = "0.0.0"
description = "Project scripts and experiments"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiscreening*", "react*", "bosniak*"]
